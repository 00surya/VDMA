[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vmd-shield"
version = "0.1.0"
description = "Local pose, motion and relative-depth incident review prototype"
requires-python = ">=3.10,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "numpy>=1.26,<3", "opencv-python>=4.10,<5", "imageio-ffmpeg>=0.6,<1"]

[project.optional-dependencies]
vision = ["ultralytics>=8.4.148,<9", "torch>=2.6,<3", "torchvision>=0.17,<1", "timm==0.6.13", "einops>=0.6,<1", "lap>=0.5,<1", "onnxruntime>=1.20,<2"]
depth-export = ["onnx>=1.17,<2", "torch>=2.6,<3"]
ai = ["reportlab>=4,<5", "google-genai>=1.0,<3", "python-dotenv>=1,<2", "google-auth-oauthlib>=1,<2", "twilio>=9,<10"]
test = ["pypdf>=5,<7", "pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["vmd*"]

[tool.setuptools.package-data]
vmd = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
